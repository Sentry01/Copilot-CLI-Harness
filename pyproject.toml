[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-harness"
version = "2.0.0"
description = "Test-driven autonomous development harness for GitHub Copilot (SDK + CLI)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "github-copilot-sdk>=1.0.16,<2",
    "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
copilot-harness = "copilot_harness.cli:main"

[tool.setuptools.packages.find]
include = ["copilot_harness*"]

[tool.setuptools.package-data]
copilot_harness = ["prompts/*.md", "templates/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: runs real Playwright against a sample app (needs Node + browsers; set HARNESS_E2E=1)"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
