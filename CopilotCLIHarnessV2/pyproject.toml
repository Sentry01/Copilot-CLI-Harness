[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copilot-cli-harness"
version = "2.0.0"
description = "Autonomous coding harness for GitHub Copilot CLI, built on the Copilot SDK with a GitHub Issues feature backend."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Shlomi Shaki" }]
keywords = ["copilot", "cli", "agent", "autonomous", "sdk"]

dependencies = [
    # Copilot SDK (GA, June 2026). After install, fetch the runtime once with:
    #   python -m copilot download-runtime
    "github-copilot-sdk>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
copilot-harness = "copilot_harness.cli:main"

[project.urls]
Homepage = "https://github.com/Sentry01/CopilotCLIHarnessV2"

[tool.setuptools.packages.find]
include = ["copilot_harness*"]

[tool.setuptools.package-data]
copilot_harness = ["prompts/*.md", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
